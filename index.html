<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Clientes - Oficina</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        /* Background com padrão de pista */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 35px,
                    rgba(255, 255, 255, 0.03) 35px,
                    rgba(255, 255, 255, 0.03) 70px
                );
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 40px 20px;
            position: relative;
        }

        header::before {
            content: '🏁';
            display: block;
            font-size: 3em;
            margin-bottom: 10px;
        }

        header h1 {
            font-size: 2.8em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            font-weight: 700;
            letter-spacing: 1px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .content {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .form-section {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            border-left: 6px solid #e74c3c;
            position: relative;
            overflow: hidden;
        }

        .form-section::before {
            content: '🔧';
            position: absolute;
            top: -10px;
            right: -10px;
            font-size: 80px;
            opacity: 0.05;
        }

        .form-section h2 {
            color: #1a1a2e;
            margin-bottom: 25px;
            font-size: 1.6em;
            border-bottom: 3px solid #e74c3c;
            padding-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-section h2::before {
            content: '🚗';
            font-size: 1.3em;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #1a1a2e;
            font-weight: 600;
            font-size: 0.95em;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            transition: all 0.3s;
            background: #f9f9f9;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="date"]:focus,
        textarea:focus {
            outline: none;
            border-color: #e74c3c;
            background: white;
            box-shadow: 0 0 0 4px rgba(231, 76, 60, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.05em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(231, 76, 60, 0.4);
        }

        button:active {
            transform: translateY(-1px);
        }

        .info-section {
            display: none;
        }

        .clients-section {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            grid-column: 1 / -1;
            border-top: 6px solid #27ae60;
            position: relative;
            overflow: hidden;
        }

        .clients-section::before {
            content: '🏎️';
            position: absolute;
            top: -10px;
            right: -10px;
            font-size: 80px;
            opacity: 0.05;
        }

        .clients-section h2 {
            color: #1a1a2e;
            margin-bottom: 25px;
            font-size: 1.6em;
            border-bottom: 3px solid #27ae60;
            padding-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .clients-section h2::before {
            content: '📋';
            font-size: 1.3em;
        }

        .client-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .client-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #ecf0f1 100%);
            border: 2px solid #bdc3c7;
            border-radius: 12px;
            padding: 25px;
            transition: all 0.3s;
            position: relative;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #e74c3c;
        }

        .client-card::before {
            content: '🚗';
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 2em;
            opacity: 0.1;
        }

        .client-card:hover {
            border-color: #e74c3c;
            box-shadow: 0 10px 30px rgba(231, 76, 60, 0.2);
            transform: translateY(-8px);
        }

        .client-card h3 {
            color: #e74c3c;
            margin-bottom: 15px;
            font-size: 1.4em;
            word-break: break-word;
        }

        .client-info {
            margin-bottom: 12px;
            color: #555;
            font-size: 0.95em;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .client-info strong {
            color: #1a1a2e;
            font-weight: 600;
            min-width: 120px;
        }

        .client-info span {
            text-align: right;
            flex: 1;
        }

        .client-description {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 4px solid #e74c3c;
            color: #555;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .client-description strong {
            color: #1a1a2e;
        }

        .delete-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #e74c3c;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.3em;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: 0 3px 10px rgba(231, 76, 60, 0.3);
        }

        .delete-btn:hover {
            background: #c0392b;
            transform: scale(1.1);
        }

        .empty-message {
            text-align: center;
            color: #95a5a6;
            padding: 60px 20px;
            font-size: 1.1em;
        }

        .empty-message::before {
            content: '🚫';
            display: block;
            font-size: 3em;
            margin-bottom: 15px;
        }

        footer {
            background: rgba(26, 26, 46, 0.9);
            color: white;
            text-align: center;
            padding: 30px 20px;
            border-radius: 15px;
            margin-top: 50px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .footer-content {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 30px;
        }

        .footer-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .footer-stat h3 {
            font-size: 2.5em;
            color: #e74c3c;
            margin: 0;
        }

        .footer-stat p {
            color: #bdc3c7;
            font-size: 0.9em;
            margin: 0;
        }

        .footer-divider {
            width: 2px;
            height: 50px;
            background: rgba(231, 76, 60, 0.3);
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 2em;
            }

            .client-list {
                grid-template-columns: 1fr;
            }

            .footer-content {
                flex-direction: column;
                gap: 20px;
            }

            .footer-divider {
                width: 50px;
                height: 2px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Gerenciamento de Clientes</h1>
            <p>Sistema para controlar informações de clientes da oficina</p>
        </header>

        <div class="content">
            <div class="form-section">
                <h2>Adicionar Cliente</h2>
                <form id="clientForm">
                    <div class="form-group">
                        <label for="nome">Nome do Cliente</label>
                        <input type="text" id="nome" name="nome" placeholder="Ex: João Silva">
                    </div>

                    <div class="form-group">
                        <label for="matricula">Matrícula do Veículo</label>
                        <input type="text" id="matricula" name="matricula" placeholder="Ex: AB-12-CD">
                    </div>

                    <div class="form-group">
                        <label for="km">Quilometragem (km)</label>
                        <input type="number" id="km" name="km" placeholder="Ex: 125000" min="0">
                    </div>

                    <div class="form-group">
                        <label for="data">Data</label>
                        <input type="date" id="data" name="data">
                    </div>

                    <div class="form-group">
                        <label for="descricao">Descrição do Serviço</label>
                        <textarea id="descricao" name="descricao" placeholder="Descreva o serviço a realizar ou observações importantes..."></textarea>
                    </div>

                    <button type="submit">Adicionar Cliente</button>
                </form>
            </div>


        </div>

        <div class="clients-section">
            <h2>Lista de Clientes</h2>
            <div class="client-list" id="clientList">
                <div class="empty-message">Nenhum cliente cadastrado ainda. Adicione um cliente no formulário acima!</div>
            </div>
        </div>

        <footer>
            <div class="footer-content">
                <div class="footer-stat">
                    <h3 id="totalClientes">0</h3>
                    <p>Clientes Registados</p>
                </div>
                <div class="footer-divider"></div>
                <div class="footer-stat">
                    <p style="font-size: 1.2em;">🔧 Oficina Automóvel 🔧</p>
                    <p style="font-size: 0.8em; margin-top: 5px;">Sistema de Gerenciamento</p>
                </div>
            </div>
        </footer>
    </div>

    <script>
        // Carregar clientes do localStorage
        function carregarClientes() {
            const clientes = JSON.parse(localStorage.getItem('clientes')) || [];
            exibirClientes(clientes);
            atualizarEstatisticas(clientes);
        }

        // Salvar clientes no localStorage
        function salvarClientes(clientes) {
            localStorage.setItem('clientes', JSON.stringify(clientes));
        }

        // Exibir clientes na tela
        function exibirClientes(clientes) {
            const clientList = document.getElementById('clientList');
            
            if (clientes.length === 0) {
                clientList.innerHTML = '<div class="empty-message">Nenhum cliente cadastrado ainda. Adicione um cliente no formulário acima!</div>';
                return;
            }

            clientList.innerHTML = clientes.map((cliente, index) => `
                <div class="client-card">
                    <button class="delete-btn" onclick="deletarCliente(${index})">✕</button>
                    <h3>${cliente.nome || 'Cliente sem nome'}</h3>
                    ${cliente.matricula ? `<div class="client-info"><strong>Matrícula:</strong> <span>${cliente.matricula}</span></div>` : ''}
                    ${cliente.km ? `<div class="client-info"><strong>Quilometragem:</strong> <span>${cliente.km} km</span></div>` : ''}
                    ${cliente.data ? `<div class="client-info"><strong>Data:</strong> <span>${new Date(cliente.data).toLocaleDateString('pt-PT')}</span></div>` : ''}
                    ${cliente.descricao ? `<div class="client-description"><strong>Descrição:</strong><br>${cliente.descricao}</div>` : ''}
                </div>
            `).join('');
        }

        // Atualizar estatísticas
        function atualizarEstatisticas(clientes) {
            document.getElementById('totalClientes').textContent = clientes.length;
        }

        // Adicionar novo cliente
        document.getElementById('clientForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const novoCliente = {
                nome: document.getElementById('nome').value,
                matricula: document.getElementById('matricula').value,
                km: document.getElementById('km').value,
                data: document.getElementById('data').value,
                descricao: document.getElementById('descricao').value
            };

            const clientes = JSON.parse(localStorage.getItem('clientes')) || [];
            clientes.push(novoCliente);
            salvarClientes(clientes);

            // Limpar formulário
            this.reset();

            // Atualizar exibição
            carregarClientes();

            // Mostrar mensagem de sucesso
            alert('Cliente adicionado com sucesso!');
        });

        // Deletar cliente
        function deletarCliente(index) {
            if (confirm('Tem certeza que deseja deletar este cliente?')) {
                const clientes = JSON.parse(localStorage.getItem('clientes')) || [];
                clientes.splice(index, 1);
                salvarClientes(clientes);
                carregarClientes();
            }
        }

        // Carregar clientes ao abrir a página
        window.addEventListener('DOMContentLoaded', carregarClientes);

        // Definir data de hoje como padrão
        document.getElementById('data').valueAsDate = new Date();
    </script>
</body>
</html>
